[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbot"
version = "0.1.0"
description = "Personal Telegram bot that turns messages and files into Markdown notes."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Prompt templates are loaded from disk at runtime (see engine/prompts/__init__.py).
"contextbot.engine.prompts" = ["*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
